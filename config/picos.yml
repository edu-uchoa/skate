#
#   - nome: Nome do pico
#     tipo: pista
#     descricao: Piso liso, bom para iniciante.
#     lat: -15.7939
#     lng: -47.8828
#
# O teste test/models/spot_test.rb confere se cada pico está preenchido certo.
